<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลงทะเบียนสำเร็จ</title><style>body{font-family:Arial,Tahoma;background:#102958;padding:15px}.card{max-width:650px;margin:auto;background:white;border-radius:20px;padding:25px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:10px}.total{text-align:center;background:#eef5ff;padding:18px;margin-top:15px;font-size:22px}</style><div class="card"><h1>ลงทะเบียนสำเร็จ ✓</h1><p id="id"></p><div id="c"></div><div id="t"></div><a href="index.html">กลับหน้าหลัก</a></div><script>let d=JSON.parse(sessionStorage.registration),x=d.data;id.textContent='เลขที่ลงทะเบียน: '+d.registrationId;c.innerHTML=[['ชื่อ-นามสกุล',x.name],['เบอร์โทร',x.phone],['สินค้า',x.brand+' '+x.model],['รายละเอียด',x.detail],['ราคา',x.price.toLocaleString()+' บาท'],['บริการเช่าซื้อ',x.service],['เงินดาวน์',x.downAmount?x.downAmount.toLocaleString()+' บาท':'-'],['จำนวนงวด',x.term?x.term+' งวด':'-']].map(r=>'<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');t.innerHTML='<div class="total">ค่างวดประมาณ <b>'+x.installment.toLocaleString()+'</b> บาท/เดือน</div>'</script></html>
